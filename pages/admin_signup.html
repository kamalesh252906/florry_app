<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Signup - Florry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/auth-style.css">
</head>
<body>
    <div class="auth-container">
        <!-- Brand Section -->
        <div class="auth-left auth-left-admin">
            <div class="back-link">
                <a href="../index.html">← Back to Home</a>
            </div>
            <div class="auth-brand">
                <h1>Partner with <span>Florry</span></h1>
                <p>Grow your floral business with our global reach and lightning-fast delivery network.</p>
            </div>
            <div class="auth-footer-info">
                &copy; 2024 Florry Partner Network. All rights reserved.
            </div>
        </div>

        <!-- Form Section -->
        <div class="auth-right">
            <div class="auth-form-box">
                <h2>Create Store Account</h2>
                <p class="subtitle">Join our community of elite floral artists</p>

                <form id="signup-form">
                    <input type="radio" name="role" value="admin" checked style="display:none">
                    <div class="input-row">
                        <div class="input-group">
                            <label>Owner Name <span class="required">*</span></label>
                            <input type="text" id="signup-name" placeholder="Enter full name" required>
                        </div>

                        <div class="input-group">
                            <label>Boutique Name <span class="required">*</span></label>
                            <input type="text" id="signup-shop-name" placeholder="e.g. Bloom Haven" required>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label>Business Email <span class="required">*</span></label>
                            <input type="email" id="signup-email" placeholder="owner@shop.com" required>
                        </div>
                        <div class="input-group">
                            <label>Contact Number <span class="required">*</span></label>
                            <input type="tel" id="signup-phone" placeholder="9876543210" required>
                        </div>
                    </div>
                    
                    <div class="input-group" id="shop-fields">
                        <label>Store Front Display <span class="required">*</span></label>
                        <div class="drop-zone" id="shop-image-dropzone">
                            <p>Click or drag shop photo</p>
                        </div>
                        <input type="file" id="shop-image-input" class="d-none" accept="image/*">
                        <input type="hidden" id="shop-image-url">
                    </div>

                    <div class="input-row grid-partner-id">
                        <div class="input-group">
                            <label>National ID / Aadhaar <span class="required">*</span></label>
                            <input type="text" id="aadhaar-number" placeholder="Enter ID number" required>
                        </div>
                        <div class="input-group">
                            <label>ID Document <span class="required">*</span></label>
                            <div class="drop-zone" id="aadhaar-image-dropzone">
                            </div>
                            <input type="file" id="aadhaar-image-input" class="d-none" accept="image/*">
                            <input type="hidden" id="aadhaar-image-url">
                        </div>
                    </div>
                    
                    <div class="input-group location-capture-group">
                         <label class="location-label">
                             <span>📍</span> Digital Store Location
                         </label>
                         <div class="input-row mb-15">
                             <input type="text" id="latitude" placeholder="Latitude" readonly class="bg-white">
                             <input type="text" id="longitude" placeholder="Longitude" readonly class="bg-white">
                         </div>
                         <button type="button" id="location-btn" class="gps-btn">
                             Capture GPS Coordinates
                         </button>
                    </div>

                    <div class="input-group mt-25">
                        <label>Security Password <span class="required">*</span></label>
                        <input type="password" id="signup-password" placeholder="Min 10 characters" required>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-btn">Continue Partnership Registration</button>
                </form>

                <div class="switch-auth">
                    <p>Already a partner? <a href="./admin_login.html">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/image-uploader.js"></script>
    <script type="module" src="../js/auth-ui.js"></script>
</body>

</html>
