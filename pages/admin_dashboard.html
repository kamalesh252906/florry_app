<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Florry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/utilities.css">
    <link rel="stylesheet" href="../styles/admin.css">

</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="logo">
                <span class="logo-icon">🌸</span>
                <span class="logo-text">Florry Partner</span>
            </div>
            <nav>
                <a href="#orders" class="nav-item active">
                    <span class="stat-icon-small"></span> Orders
                </a>
                <a href="#products" class="nav-item">
                    <span class="stat-icon-small">🌸</span> Products
                </a>
                <a href="#settings" class="nav-item" id="nav-settings">
                    <span class="stat-icon-small">⚙️</span> Shop Settings
                </a>
                <div class="admin-nav-divider">
                    <hr>
                </div>
                <a href="#" class="nav-item admin-sign-out" id="admin-logout-btn">
                 Sign Out
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="fade-in admin-welcome-msg">
                    <h1 id="shop-welcome-msg">Welcome Back!</h1>
                    <p>Your Shop is looking great today.</p>
                </div>
                <div class="fade-in admin-header-actions">
                    <button class="add-to-cart-btn btn-add-bloom" id="btn-add-flower">+ List New Bloom</button>
                </div>
            </header>
            <section id="orders">
                <h2 class="admin-section-title">Recent Orders</h2>
                <div class="admin-grid admin-orders-grid-container" id="admin-orders-grid">
                    <!-- Orders loaded here -->
                </div>
            </section>

            <section id="products">
                <h2 class="admin-section-title">Your Products</h2>
                <div class="admin-grid" id="admin-grid">
                    <!-- Products loaded here -->
                </div>
            </section>
        </main>
    </div>

    
    <div class="modal" id="flower-modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Flower</h2>
            <form id="flower-form">
                <input type="hidden" id="flower-id">
                
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="flower-name" required>
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <select id="flower-category" required>
                        <option value="flowers">Flowers</option>
                        <option value="decorations">Decorations</option>
                        <option value="garlands">Garlands (Maalai)</option>
                        <option value="tied_flowers">Tied Flowers</option>
                        <option value="ready_made">Ready-made Flower Products</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="flower-price" required min="0" step="0.01">
                </div>
                
                <div class="form-group">
                    <label>Weight (Grams)</label>
                    <input type="number" id="flower-grams" required min="0" placeholder="e.g. 250">
                </div>
                
                <div class="form-group">
                    <label>Flower Image</label>
                    <div class="drop-zone drop-zone-small" id="flower-image-dropzone">
                        <p class="drop-zone-text-small">Drag & drop image or click</p>
                    </div>
                    <input type="file" id="flower-image-input" accept="image/*" class="d-none">
                    <input type="hidden" id="flower-image-url">
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="flower-description" rows="3"></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="close-flower-modal">Cancel</button>
                    <button type="submit" class="save-btn">Save Flower</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Shop Settings Modal -->
    <div class="modal" id="shop-modal">
        <div class="modal-content">
            <h2> Shop Settings</h2>
            <form id="shop-form">
                <div class="form-group">
                    <label>Shop Name</label>
                    <input type="text" id="shop-name-input" required>
                </div>
                
                <div class="form-group">
                    <label>Shop Photo</label>
                    <div class="drop-zone drop-zone-small" id="shop-image-dropzone">
                        <p class="drop-zone-text-small">Drag & drop shop photo or click</p>
                    </div>
                    <input type="file" id="shop-image-input-file" accept="image/*" class="d-none">
                    <input type="hidden" id="shop-settings-image-url">
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="close-shop-modal">Cancel</button>
                    <button type="submit" class="save-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/admin.js"></script>
</body>
</html>
