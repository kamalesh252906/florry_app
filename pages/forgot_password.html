<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Florry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/auth-style.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="stylesheet" href="../styles/utilities.css">
    <link rel="stylesheet" href="../styles/loader.css">
    <script src="../js/loader.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <div class="back-link">
                <a href="./landing.html" id="back-to-login">← Back to Login</a>
            </div>
            <div class="auth-brand">
                <h1>Florry</h1>
                <p>Recovery Portal</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-form-box">
                <h2>Reset Password</h2>
                <p class="subtitle" id="form-subtitle">Enter your email and new password to recover access</p>

                <div id="reset-form-container">
                    <form id="forgot-password-form">
                        <div class="input-group">
                            <label>User Type</label>
                            <select id="user-type" class="auth-select">
                                <option value="customer">Customer</option>
                                <option value="admin">Store Admin</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Email Address <span class="required">*</span></label>
                            <input type="email" id="reset-email" placeholder="Enter your registered email" required>
                        </div>

                        <div class="input-group">
                            <label>New Password <span class="required">*</span></label>
                            <input type="password" id="new-password" placeholder="Enter new password" required minlength="6">
                        </div>

                        <button type="submit" class="submit-btn submit-btn-primary" id="reset-btn">Save New Password</button>
                    </form>
                </div>

                <div id="success-message" class="hidden text-center">
                    <h3 class="mt-20">Password Updated!</h3>
                    <p class="text-gray mb-30">Your password has been reset successfully.</p>
                    <button class="submit-btn submit-btn-primary" id="btn-return-login">Return to Login</button>
                </div>

                <div class="switch-auth">
                    <p>Remembered your password? <a href="./login.html" id="login-link">Login here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/forgot-password.js"></script>
</body>
</html>
