<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Florry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/auth-style.css">
    <link rel="stylesheet" href="../styles/loader.css">
    <script src="../js/loader.js" defer></script>

    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Brand Section -->
        <div class="auth-left auth-left-admin">
            <div class="back-link">
                <a href="../index.html">← Back to Home</a>
            </div>
            <div class="auth-brand">
                <h1>Command <span>Center</span></h1>
                <p>Manage your floral empire from a single, powerful and intuitive dashboard.</p>
            </div>
            <div class="auth-footer-info">
                Secure SSL Encrypted Environment
            </div>
        </div>

        <!-- Form Section -->
        <div class="auth-right">
            <div class="auth-form-box">
                <h2>Admin Access</h2>
                <p class="subtitle">Securely manage your shop and orders</p>

                <form id="login-form">
                    <input type="radio" name="role" value="admin" checked style="display:none">
                    <div class="input-group">
                        <label>Admin ID / Email Address <span class="required">*</span></label>
                        <input type="email" id="login-email" placeholder="admin@shop.com" required>
                    </div>

                    <div class="input-group">
                        <label>Security Password <span class="required">*</span></label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>

                    <div class="forgot-password-link">
                        <a href="./forgot_password.html?type=admin">Recover Credentials?</a>
                    </div>

                    <button type="submit" class="submit-btn" id="login-btn">Authenticate & Enter</button>
                </form>

                <div class="switch-auth">
                    <p>Want to partner with us? <a href="./signup.html">Request Partnership Access</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/auth-ui.js"></script>
</body>

</html>
