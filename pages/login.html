<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Florry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/auth-style.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="stylesheet" href="../styles/utilities.css">
    <link rel="stylesheet" href="../styles/loader.css">
    <script src="../js/loader.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <!-- Brand Section -->
        <div class="auth-left auth-bg-login">
            <div class="back-link">
                <a href="../index.html">← Back to Home</a>
            </div>
            <div class="auth-brand">
                <h1>Welcome <span>Back</span></h1>
                <p>Login to your Florry account to continue your journey.</p>
            </div>
        </div>

        <!-- Form Section -->
        <div class="auth-right">
            <div class="auth-form-box">
                <h2>Sign In</h2>
                <p class="subtitle">Access your dashboard</p>

                <!-- Role Selector -->
                <div class="role-selector">
                    <label class="role-option active">
                        <input type="radio" name="role" value="user" checked>
                        Customer
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="admin">
                        Shop Partner
                    </label>
                </div>

                <form id="login-form">
                    <div class="input-group">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="text" id="login-email" placeholder="name@example.com" required>
                    </div>

                    <div class="input-group">
                        <label>Password <span class="required">*</span></label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>

                    <div class="forgot-password-link">
                        <a href="./forgot_password.html?type=customer" id="forgot-password-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn" id="login-btn">Login</button>
                </form>

                <div class="switch-auth">
                    <p>Don't have an account? <a href="./signup.html">Create one</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/auth-ui.js"></script>
</body>
</html>
