<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Florry - Fresh Flower Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="../styles/auth-style.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="stylesheet" href="../styles/utilities.css">
</head>
<body>
    <div class="auth-container">
        <!-- Brand Section -->
        <div class="auth-left auth-bg-signup">
            <div class="back-link">
                <a href="../index.html">← Back to Home</a>
            </div>
            <div class="auth-brand">
                <h1>Join Florry</h1>
                <p>Start your journey with us.</p>
            </div>
        </div>

        <!-- Form Section -->
        <div class="auth-right">
            <div class="auth-form-box">
                <h2>Create Account</h2>

                <!-- Role Selector -->
                <div class="role-selector">
                    <label class="role-option active" data-role="user">
                        <input type="radio" name="role" value="user" checked>
                        Customer
                    </label>
                    <label class="role-option" data-role="admin">
                        <input type="radio" name="role" value="admin">
                        Shop Partner
                    </label>
                </div>

                <form id="signup-form">
                    
                    <!-- Common Fields -->
                    <div class="input-row">
                        <div class="input-group">
                            <label>Name <span class="required">*</span></label>
                            <input type="text" id="signup-name" placeholder="Your Name" required>
                        </div>
                        <div class="input-group">
                            <label>Phone <span class="required">*</span></label>
                            <input type="tel" id="signup-phone" placeholder="9876543210" maxlength="10" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" id="signup-email" placeholder="name@example.com" required>
                    </div>

                    <!-- Shop Partner Specific Fields (Hidden by default) -->
                    <div id="shop-fields">
                        <h3 class="mt-15 text-primary" style="font-size: 1rem;">Shop Details</h3>
                        <div class="input-group">
                            <label>Boutique Name <span class="required">*</span></label>
                            <input type="text" id="signup-shop-name" placeholder="Flower Shop Name">
                        </div>
                        
                        <!-- Uploads -->
                        <div class="input-group">
                            <label>Store Photo <span class="required">*</span></label>
                            <div class="drop-zone" id="shop-image-dropzone">
                                <span style="font-size: 0.8rem; color: var(--gray);">Click to Upload Shop Image</span>
                            </div>
                            <input type="file" id="shop-image-input" accept="image/*" style="display: none;">
                            <input type="hidden" id="shop-image-url">
                        </div>

                        <div class="input-group">
                            <label>ID Document (Aadhaar) <span class="required">*</span></label>
                            <div class="drop-zone" id="aadhaar-image-dropzone">
                                <span style="font-size: 0.8rem; color: var(--gray);">Click to Upload ID</span>
                            </div>
                            <input type="file" id="aadhaar-image-input" accept="image/*" style="display: none;">
                            <input type="hidden" id="aadhaar-image-url">
                        </div>

                         <div class="input-group bg-light p-15 br-12 mt-15">
                             <label class="mb-10" style="display: block;">📍 Store Location</label>
                             <div class="input-row mb-10">
                                 <input type="text" id="latitude" placeholder="Lat" readonly class="bg-white">
                                 <input type="text" id="longitude" placeholder="Lng" readonly class="bg-white">
                             </div>
                             <button type="button" id="location-btn" class="w-full bg-white border-primary text-primary br-12 cursor-pointer p-15">
                                 Get GPS Location
                             </button>
                        </div>
                        
                         <div class="input-group">
                            <label>Aadhaar Number <span class="required">*</span></label>
                            <input type="text" id="aadhaar-number" placeholder="Enter ID number">
                        </div>
                    </div>

                    <!-- Password Common -->
                    <div class="input-group mt-15">
                        <label>Password <span class="required">*</span></label>
                        <input type="password" id="signup-password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="submit-btn" id="signup-btn">Create Account</button>
                </form>

                <div class="switch-auth">
                    <p>Already have an account? <a href="./login.html">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/image-uploader.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/auth-ui.js"></script>
</body>
</html>
